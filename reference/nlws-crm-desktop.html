function filteredCalls(){
  const q = outreachQuery.trim().toLowerCase();
  if(!q) return calls;
  return calls.filter(c => {
    const name = c.dealId ? (deals.find(d=>d.id===c.dealId)?.company||"") : (c.clientName||"");
    return name.toLowerCase().includes(q) || (c.notes||"").toLowerCase().includes(q);
  });
}
function filteredOutreach(){
  const q = outreachQuery.trim().toLowerCase();
  if(!q) return outreach;
  return outreach.filter(o => {
    const name = o.dealId ? (deals.find(d=>d.id===o.dealId)?.company||"") : (o.clientName||"");
    return name.toLowerCase().includes(q) || (o.notes||"").toLowerCase().includes(q) || (o.channel||"").toLowerCase().includes(q) || (o.status||"").toLowerCase().includes(q);
  });
}

function refreshOutreachListArea(){
  const bulkBar = document.getElementById("outreachBulkBar");
  const el = document.getElementById("outreachListArea");
  if(!bulkBar || !el) return;

  const selectedSet = outreachTab==='calls' ? selectedCallIds : selectedOutreachIds;
  if(selectedSet.size > 0){
    bulkBar.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;background:#2A1616;border:1px solid #4A2A26;border-radius:8px;padding:10px 14px;margin-bottom:12px">
        <span style="font-size:13px;font-weight:600;color:#E8A79E">${selectedSet.size} selected</span>
        <button class="doc-btn danger" id="outreachBulkDeleteBtn">Delete Selected</button>
        <button class="doc-btn ghost" id="outreachClearSelBtn">Clear selection</button>
      </div>`;
    document.getElementById("outreachBulkDeleteBtn").onclick = () => renderOutreachBulkDeleteConfirm(outreachTab);
    document.getElementById("outreachClearSelBtn").onclick = () => { selectedSet.clear(); refreshOutreachListArea(); };
  } else {
    bulkBar.innerHTML = "";
  }

  if(outreachTab === 'calls') renderCallsTable(el);
  else renderOutreachTable(el);
}

function renderCallsTable(el){
  const list = [...filteredCalls()].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(list.length===0){ el.innerHTML = `<div class="empty">${calls.length===0 ? "No calls logged yet." : "Nothing matches that search."}</div>`; return; }
  const allSelected = list.length>0 && list.every(c=>selectedCallIds.has(c.id));
  el.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:30px"><input type="checkbox" id="callsSelectAll" ${allSelected?"checked":""} /></th>
        <th>Date Added</th><th>Client</th><th>Outcome</th><th>Notes</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(c => {
          const dealName = c.dealId ? (deals.find(d=>d.id===c.dealId)?.company || "") : "";
          const displayName = dealName || c.clientName || "";
          const outcome = c.outcome || "Not Called Yet";
          const color = CALL_OUTCOMES[outcome] || "var(--draft)";
          return `
          <tr class="call-row" data-rowid="${c.id}" style="cursor:pointer">
            <td><input type="checkbox" class="call-select" data-id="${c.id}" ${selectedCallIds.has(c.id)?"checked":""} /></td>
            <td>${c.date}${num(c.count)>1?` <span class="pill" style="background:#232A3A;color:#C9D6F0">${c.count}x</span>`:""}</td>
            <td>${displayName ? escSafe(displayName) : `<span style="color:#707C97">General</span>`}</td>
            <td>
              <select class="call-outcome-select" data-id="${c.id}" style="border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:${color}15;color:${color};font-weight:600">
                ${Object.keys(CALL_OUTCOMES).map(o=>`<option value="${o}" ${outcome===o?"selected":""}>${o}</option>`).join("")}
              </select>
              ${c.outcomeDate ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px">on ${c.outcomeDate}</div>` : ""}
            </td>
            <td class="td-sub" style="max-width:280px">${escSafe(c.notes)||"—"}</td>
            <td style="white-space:nowrap">
              <button class="iconbtn" data-calledit="${c.id}">Edit</button>
              <button class="iconbtn" data-calldel="${c.id}">Delete</button>
            </td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
  el.querySelectorAll(".call-row").forEach(row => row.onclick = (e) => {
    if(e.target.closest('input, select, button')) return;
    openCallModal(calls.find(c=>c.id===row.dataset.rowid));
  });
  el.querySelectorAll("[data-calledit]").forEach(b => b.onclick = () => openCallModal(calls.find(c=>c.id===b.dataset.calledit)));
  el.querySelectorAll("[data-calldel]").forEach(b => b.onclick = () => {
    calls = calls.filter(c=>c.id!==b.dataset.calldel);
    saveCalls(); refreshOutreachListArea(); toast("Call deleted");
  });
  el.querySelectorAll(".call-outcome-select").forEach(sel => sel.onchange = () => {
    const c = calls.find(x=>x.id===sel.dataset.id);
    if(!c) return;
    c.outcome = sel.value;
    if(sel.value !== "Not Called Yet" && !c.outcomeDate) c.outcomeDate = today();
    if(sel.value === "Not Called Yet") c.outcomeDate = "";
    saveCalls();
    refreshOutreachListArea();
    toast("Outcome updated");
  });
  el.querySelectorAll(".call-select").forEach(cb => cb.onchange = () => {
    if(cb.checked) selectedCallIds.add(cb.dataset.id); else selectedCallIds.delete(cb.dataset.id);
    refreshOutreachListArea();
  });
  const selectAll = document.getElementById("callsSelectAll");
  if(selectAll) selectAll.onchange = () => {
    if(selectAll.checked) list.forEach(c => selectedCallIds.add(c.id));
    else list.forEach(c => selectedCallIds.delete(c.id));
    refreshOutreachListArea();
  };
}

function renderOutreachTable(el){

function renderWipeConfirm(tab){
  const count = tab==='calls' ? calls.length : outreach.length;
  const label = tab==='calls' ? 'call' : 'outreach';
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "wipeOverlay";
  overlay.innerHTML = `
    <div class="confirm-modal">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px">Wipe the entire ${label} list?</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:4px">This deletes all <strong>${count}</strong> ${label} entr${count===1?"y":"ies"} — every one, not just what's showing. This can't be undone.</div>
      <div class="modal-footer" style="padding:16px 0 0">
        <button class="cancelbtn" id="cancelWipe">Cancel</button>
        <button class="deletebtn" id="confirmWipe">Wipe All ${count}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.getElementById("cancelWipe").onclick = () => overlay.remove();
  document.getElementById("confirmWipe").onclick = () => {
    if(tab==='calls'){
      calls = [];
      selectedCallIds.clear();
      saveCalls();
    } else {
      outreach = [];
      selectedOutreachIds.clear();
      saveOutreach();
    }
    overlay.remove();
    render();
    toast(`${label==='calls'?'Call':'Outreach'} list wiped`);
  };
}

function openVisionModal(item){
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "visionOverlay";
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header"><span>${item.title ? "Edit Board Item" : "Add to Vision Board"}</span><button id="closeVisionModal">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Title</label><input id="v-title" value="${escSafe(item.title)}" placeholder="e.g. Hit R50k/month, Dream office setup…" /></div>
        <div class="field"><label>Image URL (optional)</label><input id="v-imageurl" value="${item.image && item.image.startsWith('http') ? escSafe(item.image) : ''}" placeholder="https://…" /></div>
        <div class="field"><label>Or upload an image</label><input type="file" id="v-imagefile" accept="image/*" /></div>
        <div class="field"><label>Notes</label><textarea id="v-notes" style="min-height:60px">${escSafe(item.notes)}</textarea></div>
      </div>
      <div class="modal-footer">
        <button class="cancelbtn" id="cancelVision">Cancel</button>
        <button class="savebtn" id="saveVision">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  let uploadedImage = item.image && !item.image.startsWith('http') ? item.image : "";
  document.getElementById("v-imagefile").onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { uploadedImage = reader.result; };
    reader.readAsDataURL(file);
  };
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.getElementById("closeVisionModal").onclick = () => overlay.remove();
  document.getElementById("cancelVision").onclick = () => overlay.remove();
  document.getElementById("saveVision").onclick = () => {
    const urlVal = document.getElementById("v-imageurl").value.trim();
    const updated = { ...item, title: document.getElementById("v-title").value, image: uploadedImage || urlVal, notes: document.getElementById("v-notes").value };
    const exists = visionItems.some(v=>v.id===updated.id);
    visionItems = exists ? visionItems.map(v=>v.id===updated.id?updated:v) : [...visionItems, updated];
    saveVision();
    overlay.remove();
    render();
    toast("Saved");
  };
}

/* ---------- CLIENT FILES VIEW ---------- */
function fmtFileSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return Math.round(bytes/1024) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

function renderFilesView(container){
  if(filesSelectedDealId){
    renderClientFolderDetail(container);
    return;
  }
  container.innerHTML = `
    <div class="toolbar">
      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93A2C2" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="filesSearchInput" placeholder="Search clients…" value="${escSafe(filesQuery)}" />
      </div>
    </div>
    <div id="folderGridArea"></div>
  `;
  document.getElementById("filesSearchInput").oninput = e => { filesQuery = e.target.value; renderFolderGrid(); };
  renderFolderGrid();
}

function renderFolderGrid(){
  const area = document.getElementById("folderGridArea");
  if(!area) return;
  const q = filesQuery.trim().toLowerCase();
  const list = deals.filter(d => !q || (d.company||"").toLowerCase().includes(q));
  const sorted = [...list].sort((a,b)=>(a.company||"").localeCompare(b.company||""));
  if(sorted.length === 0){
    area.innerHTML = `<div class="empty">${deals.length===0 ? "Add a client first — each one gets their own folder here." : "No clients match that search."}</div>`;
    return;
  }
  area.innerHTML = `<div class="folder-grid">` + sorted.map(d => `
    <div class="folder-card" data-folder="${d.id}">
      <div class="folder-icon">📁</div>
      <div class="folder-name">${escSafe(d.company)||"Untitled"}</div>
      <div class="folder-count">${(d.documents||[]).length} file${(d.documents||[]).length===1?"":"s"}</div>
    </div>`).join("") + `</div>`;
  area.querySelectorAll("[data-folder]").forEach(c => c.onclick = () => { filesSelectedDealId = c.dataset.folder; render(); });
}

function renderClientFolderDetail(container){
  const deal = deals.find(d=>d.id===filesSelectedDealId);
  if(!deal){ filesSelectedDealId = null; renderFilesView(container); return; }
  if(!deal.documents) deal.documents = [];
  container.innerHTML = `
    <button class="files-back" id="filesBackBtn">← All Client Folders</button>
    <div class="chart-wrap">
      <div class="leads-header">
        <div class="leads-title">📁 ${escSafe(deal.company)||"Untitled"}</div>
        <button class="addbtn" id="folderUploadBtn">+ Upload Image or File</button>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:12px">Stored on this device only. Keep files small (under ~2MB each) — everything shares the same browser storage.</div>
      <input type="file" id="folderFileInput" style="display:none" multiple />
      <div id="folderFilesList"></div>
    </div>
  `;
  document.getElementById("filesBackBtn").onclick = () => { filesSelectedDealId = null; render(); };
  document.getElementById("folderUploadBtn").onclick = () => document.getElementById("folderFileInput").click();
  document.getElementById("folderFileInput").onchange = (e) => {
    const files = Array.from(e.target.files || []);
    let remaining = files.length;
    files.forEach(file => {
      if(file.size > 4*1024*1024){
        toast(`"${file.name}" is over 4MB — too large to store here.`);
        remaining--;
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        deal.documents.push({ id: uid(), name: file.name, size: file.size, type: file.type||"", dataUrl: reader.result, uploadedDate: today() });
        deals = deals.map(d => d.id===deal.id ? deal : d);
        saveDeals();
        renderFolderFilesList(deal);
      };
      reader.readAsDataURL(file);
    });
    e.target.value = "";
  };
  renderFolderFilesList(deal);
}

function isImageDoc(doc){
  return (doc.type||"").startsWith("image/");
}

function openImageLightbox(doc){
  const overlay = document.createElement("div");
  overlay.className = "lightbox-overlay"; overlay.id = "lightboxOverlay";
  overlay.innerHTML = `
    <button class="lightbox-close" id="closeLightbox">✕</button>
    <img src="${doc.dataUrl}" class="lightbox-img" />
    <div class="lightbox-caption">${escSafe(doc.name)} · ${fmtFileSize(doc.size)}
      <a href="${doc.dataUrl}" download="${escSafe(doc.name)}" style="color:var(--accent);margin-left:10px">Download</a>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target===overlay) overlay.remove(); };
  document.getElementById("closeLightbox").onclick = () => overlay.remove();
  const escHandler = (e) => { if(e.key === "Escape"){ overlay.remove(); document.removeEventListener("keydown", escHandler); } };
  document.addEventListener("keydown", escHandler);
}

function renderFolderFilesList(deal){
  const listEl = document.getElementById("folderFilesList");
  if(!listEl) return;
  if(deal.documents.length === 0){
    listEl.innerHTML = `<div class="empty">No files yet for ${escSafe(deal.company)}.</div>`;
    return;
  }
  const images = [...deal.documents].filter(isImageDoc).sort((a,b)=>(b.uploadedDate||"").localeCompare(a.uploadedDate||""));
  const files = [...deal.documents].filter(d=>!isImageDoc(d)).sort((a,b)=>(b.uploadedDate||"").localeCompare(a.uploadedDate||""));

  listEl.innerHTML = `
    ${images.length ? `
      <div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 8px">🖼️ Images</div>
      <div class="creative-grid" style="margin-bottom:20px">
        ${images.map(doc => `
          <div class="creative-card" data-imgdoc="${doc.id}">
            <img src="${doc.dataUrl}" class="creative-img" data-preview="${doc.id}" style="cursor:zoom-in" />
            <div class="creative-body">
              <div class="creative-title">${escSafe(doc.name)}</div>
              <div style="font-size:10.5px;color:var(--muted);margin-bottom:8px">${fmtFileSize(doc.size)} · ${doc.uploadedDate}</div>
              <div class="doc-actions" style="margin-top:0">
                <button class="doc-btn ghost" data-preview="${doc.id}">Preview</button>
                <button class="doc-btn success" data-tomark="${doc.id}">+ Marketing</button>
                <button class="doc-btn danger" data-folderdocdel="${doc.id}">Delete</button>
              </div>
            </div>
          </div>`).join("")}
      </div>` : ""}
    ${files.length ? `
      <div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 8px">📄 Files</div>
      ${files.map(doc => `
        <div class="file-row">
          <span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escSafe(doc.name)}</span>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtFileSize(doc.size)} · ${doc.uploadedDate}</span>
          <a href="${doc.dataUrl}" download="${escSafe(doc.name)}" class="doc-btn ghost" style="text-decoration:none;display:inline-block">View</a>
          <button class="doc-btn danger" data-folderdocdel="${doc.id}">Delete</button>
        </div>`).join("")}` : ""}
  `;
  listEl.querySelectorAll("[data-preview]").forEach(el => el.onclick = () => {
    const doc = deal.documents.find(x=>x.id===el.dataset.preview);
    if(doc) openImageLightbox(doc);
  });
  listEl.querySelectorAll("[data-folderdocdel]").forEach(b => b.onclick = () => {
    deal.documents = deal.documents.filter(x=>x.id!==b.dataset.folderdocdel);
    deals = deals.map(d => d.id===deal.id ? deal : d);
    saveDeals();
    renderFolderFilesList(deal);
    toast("File deleted");
  });
  listEl.querySelectorAll("[data-tomark]").forEach(b => b.onclick = () => {
    const doc = deal.documents.find(x=>x.id===b.dataset.tomark);
    if(!doc) return;
    const creative = blankCreative();
    creative.image = doc.dataUrl;
    creative.title = doc.name.replace(/\.[^/.]+$/, "");
    creative.campaign = deal.company || "";
    openCreativeModal(creative);
  });
}

/* ---------- WEEKLY CHECKLIST VIEW ---------- */
function cleanupOneTimeWeeklyItems(){
  const weekStart = getWeekStart();
  const before = weeklyChecklist.length;
  weeklyChecklist = weeklyChecklist.filter(item => item.recurring || item.weekStart === weekStart);
  if(weeklyChecklist.length !== before) saveWeeklyChecklist();
}

function isWeeklyItemDone(item, weekStart){
  return item.recurring ? item.completedWeeks.includes(weekStart) : !!item.done;
}

function renderWeeklyView(container){
  cleanupOneTimeWeeklyItems();
  const weekStart = getWeekStart();
  const weekEnd = getWeekEnd(weekStart);
  const visible = weeklyChecklist.filter(item => item.recurring || item.weekStart === weekStart);
  const doneCount = visible.filter(item => isWeeklyItemDone(item, weekStart)).length;
  const total = visible.length;
  const pct = total > 0 ? Math.round((doneCount/total)*100) : 0;

  container.innerHTML = `
    <div class="week-range">Week of ${weekStart} → ${weekEnd} — recurring tasks reset every Monday; one-off tasks clear out after this week</div>
    <div class="week-progress-wrap">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-size:14px;font-weight:700">${doneCount} of ${total} done this week</div>
        <div style="font-size:13px;color:var(--muted)">${pct}%</div>
      </div>
      <div class="week-progress-bar"><div class="week-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div id="weeklyItemsArea"></div>
    <button class="add-item-btn" id="addWeeklyItemBtn" style="margin-top:6px">+ Add task</button>
  `;
  renderWeeklyItems();
  document.getElementById("addWeeklyItemBtn").onclick = () => openWeeklyItemModal();
}

function openWeeklyItemModal(){
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "weeklyItemOverlay";
  overlay.innerHTML = `
    <div class="modal narrow">
      <div class="modal-header"><span>New Task</span><button id="closeWeeklyItemModal">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Task</label><input id="wi-label" placeholder="e.g. Follow up with Simonsberg" /></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px">
          <input type="checkbox" id="wi-recurring" checked /> Repeats every week
        </label>
        <div style="font-size:11.5px;color:var(--muted)">Uncheck this for a one-off task that only applies to this week — it'll clear itself out once the week ends.</div>
      </div>
      <div class="modal-footer">
        <button class="cancelbtn" id="cancelWeeklyItem">Cancel</button>
        <button class="savebtn" id="saveWeeklyItem">Add</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.getElementById("closeWeeklyItemModal").onclick = () => overlay.remove();
  document.getElementById("cancelWeeklyItem").onclick = () => overlay.remove();
  document.getElementById("saveWeeklyItem").onclick = () => {
    const label = document.getElementById("wi-label").value.trim();
    if(!label) return;
    const recurring = document.getElementById("wi-recurring").checked;
    if(recurring){
      weeklyChecklist.push({ id: uid(), label, recurring: true, completedWeeks: [] });
    } else {
      weeklyChecklist.push({ id: uid(), label, recurring: false, weekStart: getWeekStart(), done: false });
    }
    saveWeeklyChecklist();
    overlay.remove();
    render();
    toast("Task added");
  };
}

function renderWeeklyItems(){
  const area = document.getElementById("weeklyItemsArea");
  if(!area) return;
  const weekStart = getWeekStart();
  const recurringItems = weeklyChecklist.filter(item => item.recurring);
  const onceItems = weeklyChecklist.filter(item => !item.recurring && item.weekStart === weekStart);

  if(recurringItems.length === 0 && onceItems.length === 0){
    area.innerHTML = `<div class="empty">No tasks yet. Add a recurring routine or a one-off for this week.</div>`;
    return;
  }

  const renderItem = item => {
    const done = isWeeklyItemDone(item, weekStart);
    return `
      <div class="weekly-item ${done?'done':''}" data-witem="${item.id}">
        <input type="checkbox" class="weekly-check" data-id="${item.id}" ${done?"checked":""} />
        <span class="weekly-item-label">${escSafe(item.label)}</span>
        ${!item.recurring ? `<span class="pill" style="background:#EEF2F9;color:#25406E">This week only</span>` : ""}
        <button class="remove-item" data-weeklyremove="${item.id}" type="button">×</button>
      </div>`;
  };

  area.innerHTML = `
    ${recurringItems.length ? `<div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 6px">🔁 Recurring</div>${recurringItems.map(renderItem).join("")}` : ""}
    ${onceItems.length ? `<div style="font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px">📌 This Week Only</div>${onceItems.map(renderItem).join("")}` : ""}
  `;
  area.querySelectorAll(".weekly-check").forEach(cb => cb.onchange = () => {
    const item = weeklyChecklist.find(x=>x.id===cb.dataset.id);
    if(!item) return;
    if(item.recurring){
      if(cb.checked){
        if(!item.completedWeeks.includes(weekStart)) item.completedWeeks.push(weekStart);
      } else {
        item.completedWeeks = item.completedWeeks.filter(w=>w!==weekStart);
      }
    } else {
      item.done = cb.checked;
    }
    saveWeeklyChecklist();
    renderWeeklyView(document.getElementById("viewContainer"));
  });
  area.querySelectorAll("[data-weeklyremove]").forEach(b => b.onclick = () => {
    weeklyChecklist = weeklyChecklist.filter(x=>x.id!==b.dataset.weeklyremove);
    saveWeeklyChecklist();
    renderWeeklyView(document.getElementById("viewContainer"));
  });
}

function openCreativeModal(item){

  document.getElementById("cr-imagefile").onchange = (e) => {

    render();

/* --- Content Calendar --- */
function renderContentCalendarView(area){
  const firstOfMonth = new Date(contentCalYear, contentCalMonth, 1);
  const daysInMonth = new Date(contentCalYear, contentCalMonth+1, 0).getDate();
  const startWeekday = firstOfMonth.getDay();
  const todayStr = today();

  const postsByDate = {};
  contentPosts.forEach(p => { if(!p.date) return; (postsByDate[p.date] = postsByDate[p.date] || []).push(p); });

  let cells = "";
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = contentCalYear+"-"+String(contentCalMonth+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const dayPosts = postsByDate[dateStr] || [];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === contentCalSelectedDate;
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-cdate="${dateStr}">
        <div class="cal-daynum">${day}</div>
        <div class="cal-dots">${dayPosts.slice(0,4).map(p=>`<span class="cal-dot" style="background:${CONTENT_STATUS[p.status]||'#98A4BE'}"></span>`).join("")}</div>
      </div>`;
  }

  area.innerHTML = `
    <div class="cal-nav">
      <button class="cal-navbtn" id="cPrevMonth">←</button>
      <div class="cal-month-label">${MONTH_NAMES[contentCalMonth]} ${contentCalYear}</div>
      <button class="cal-navbtn" id="cNextMonth">→</button>
      <button class="cal-navbtn" id="cTodayMonth">Today</button>
      <div style="flex:1"></div>
      <button class="addbtn" id="addContentPostBtn">+ Plan a Post</button>

function renderHashtagList(){
  const el = document.getElementById("hashtagListArea");
  if(!el) return;
  if(hashtagCollections.length === 0){
    el.innerHTML = `<div class="empty">No hashtag collections yet. Save reusable sets so you're not retyping them every post.</div>`;
    return;
  }
  el.innerHTML = hashtagCollections.map(h => `
    <div class="hashtag-card">
      <div class="hashtag-name">${escSafe(h.name)||"Untitled collection"}</div>
      <div class="hashtag-text">${escSafe(h.hashtags)||"(empty)"}</div>

function exportFinancesCSV(){
  const nowKey = monthKey(today());
  const rows = [["Date","Type","Description","Amount"]];
  invoices.forEach(inv => {
    if(inv.paymentPlan){
      (inv.installments||[]).forEach(ins => {
        if(ins.paid && monthKey(ins.paidDate)===nowKey) rows.push([ins.paidDate, "Income", `${inv.number} installment — ${inv.company||""}`, num(ins.amount)]);
      });
    } else if(inv.status==="paid" && monthKey(inv.paidDate)===nowKey){
      rows.push([inv.paidDate, "Income", `${inv.number} — ${inv.company||""}`, num(inv.amountPaid)]);
    }
  });
  ledger.forEach(l => {
    if(monthKey(l.date)===nowKey) rows.push([l.date, l.type==="income"?"Income":"Expense", l.description||"", num(l.amount)]);
  });
  deals.forEach(d => {
    if(num(d.expenses)>0 && monthKey(d.created)===nowKey) rows.push([d.created, "Expense", `Client cost — ${d.company||""}`, num(d.expenses)]);
  });
  const header = rows[0];
  const dataRows = rows.slice(1).sort((a,b)=>(a[0]||"").localeCompare(b[0]||""));
  const csv = [header, ...dataRows].map(r => r.map(v => typeof v==="string" && (v.includes(",")||v.includes('"')) ? `"${v.replace(/"/g,'""')}"` : v).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `nlws-finances-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast("CSV downloaded");
}

        deals = imported;
      } else {
        deals = imported.deals || [];
        quotes = imported.quotes || [];
        invoices = imported.invoices || [];
        ledger = imported.ledger || [];
        events = imported.events || [];
        calls = imported.calls || [];
        wins = imported.wins || [];
        timeEntries = imported.timeEntries || [];
        outreach = imported.outreach || [];
        visionItems = imported.visionItems || [];
        weeklyChecklist = imported.weeklyChecklist || [];
        creatives = imported.creatives || [];
        contentPosts = imported.contentPosts || [];
        hashtagCollections = imported.hashtagCollections || [];
        brandNotes = imported.brandNotes || "";
        counters = imported.counters || {quote:1,invoice:1};
      }
      saveDeals(); saveQuotes(); saveInvoices(); saveLedger(); saveEvents(); saveCalls(); saveWins(); saveTimeEntries(); saveOutreach(); saveVision(); saveWeeklyChecklist(); saveCreatives(); saveContentPosts(); saveHashtagCollections(); saveBrandNotes(); saveCounters();
      render();
      toast("Backup imported");
    } catch(err){
      toast("Import failed — invalid file");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
};

window.addEventListener("resize", () => { if(currentView === "finances") render(); });

let __lastKnownDate = today();
setInterval(() => {
  if(today() !== __lastKnownDate){
    __lastKnownDate = today();
    render();
  }
}, 30000);

loadAll();
isLocked = !!localStorage.getItem(PIN_KEY);
render();
</script>
