<style>
  :root{
    --ink:#EAEFF8; --muted:#93A2C2; --line:#2A3142; --bg:#0A0D14;
    --card:#1A1F2B; --accent:#1BC2BC; --li:#4E9BE0;
    --warm:#D9A050; --followup:#5B9EE0; --sentquote:#A585DB; --paidquote:#3FC189; --client:#3FC189;
    --sidebar:#070A10; --sidebar-hover:#161D2C; --sidebar-active:#1F2E4A;
    --draft:#98A4BE; --sent:#5B9EE0; --accepted:#3FC189; --declined:#E0766B; --paid:#3FC189;
    --income:#3FC189; --expense:#E0766B;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,'Segoe UI',Inter,sans-serif; background:var(--bg); color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent) !important; }
  button { cursor:pointer; font-family:inherit; }
  ::placeholder{ color:#6B7690; }

  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:220px; flex-shrink:0; background:var(--sidebar); color:#F5F8FF; padding:22px 14px; display:flex; flex-direction:column; }
  .sidebar-brand{ font-size:16px; font-weight:800; letter-spacing:-0.01em; padding:0 8px 4px; line-height:1.25; }
  .sidebar-sub{ font-size:11px; color:#8FA8D6; padding:0 8px 22px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:16px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:#C7D6F0; background:transparent; border:none; font-size:13.5px; font-weight:500; text-align:left; margin-bottom:3px; }
  .nav-item:hover{ background:var(--sidebar-hover); color:#F5F8FF; }
  .nav-item.active{ background:var(--sidebar-active); color:#F5F8FF; font-weight:600; }
  .nav-spacer{ flex:1; }
  .sidebar-footer{ font-size:10.5px; color:#6E86B5; padding:8px; }

  .main{ flex:1; padding:20px 26px; min-width:0; }
  .app{ max-width:1150px; margin:0 auto; }

  .header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .page-title{ font-size:19px; font-weight:700; letter-spacing:-0.01em; }
  .page-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .stats{ display:flex; gap:22px; }
  .stat{ text-align:right; }
  .stat-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .stat-value{ font-size:18px; font-weight:700; }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; align-items:center; }
  .searchbox{ display:flex; align-items:center; gap:8px; background:#1A1F2B; border:1px solid var(--line); border-radius:8px; padding:8px 12px; flex:1; }
  .searchbox input{ border:none; font-size:13.5px; flex:1; background:transparent; }
  .addbtn{ display:flex; align-items:center; gap:6px; background:var(--accent); color:#F5F8FF; border:none; padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600; }
  .backupbtn{ background:#1A1F2B; border:1px solid var(--line); color:#C7D0E0; padding:9px 12px; border-radius:8px; font-size:12.5px; font-weight:500; }
  .subtabs{ display:flex; background:#1A1F2B; border:1px solid var(--line); border-radius:8px; padding:3px; }
  .subtabs button{ border:none; background:transparent; padding:7px 16px; font-size:12.5px; border-radius:6px; color:#93A2C2; font-weight:500; }
  .subtabs button.active{ background:var(--sidebar); color:#F5F8FF; }

  .board{ display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; }
  .column{ min-width:210px; flex:1 1 0; background:#181E2C; border-radius:10px; padding:10px; border:1px solid var(--line); }
  .col-header{ display:flex; align-items:center; gap:6px; margin-bottom:10px; padding:0 2px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .col-title{ font-size:12.5px; font-weight:700; color:#C9D6F0; flex:1; }
  .col-count{ font-size:11px; color:var(--muted); background:#1A1F2B; padding:1px 7px; border-radius:10px; }
  .col-body{ display:flex; flex-direction:column; gap:8px; min-height:40px; }
  .col-empty{ text-align:center; color:#7E8CA8; font-size:12px; padding:10px 0; }
  .card{ background:#1A1F2B; border-radius:8px; padding:10px 12px; box-shadow:0 1px 2px rgba(15,31,61,.08); cursor:pointer; border:1px solid #2A3142; }
  .card-title{ font-size:13px; font-weight:600; margin-bottom:2px; }
  .card-sub{ font-size:11.5px; color:var(--muted); }
  .card-value{ font-size:12px; font-weight:600; color:var(--accent); margin-top:6px; }
  .card-out{ font-size:10.5px; font-weight:600; color:#E0766B; margin-top:2px; }
  .card-followup{ font-size:10.5px; font-weight:600; color:var(--warm); margin-top:6px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; background:#1A1F2B; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  th{ text-align:left; padding:10px 14px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); }
  td{ padding:11px 14px; border-bottom:1px solid #2A3142; vertical-align:middle; }
  .td-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-block; }
  .iconbtn{ border:none; background:transparent; padding:6px; border-radius:6px; color:var(--muted); }
  .empty{ text-align:center; color:#7E8CA8; font-size:13.5px; padding:40px 0; }

  .income-cards{ display:flex; gap:14px; margin-bottom:20px; }
  .income-card{ flex:1; background:#1A1F2B; border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .income-card .stat-label{ margin-bottom:6px; }
  .income-card .stat-value{ font-size:22px; }
  .chart-wrap{ background:#1A1F2B; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
  .chart-title{ font-size:13px; font-weight:700; color:#C9D6F0; margin-bottom:14px; }
  .charts-row{ display:flex; gap:16px; }
  .charts-row .chart-wrap{ flex:1; }

  .dash-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  .dash-card{ background:#1A1F2B; border:1px solid var(--line); border-radius:10px; padding:15px 16px; }
  .dash-card .stat-label{ margin-bottom:7px; }
  .dash-card .stat-value{ font-size:24px; }
  .leads-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .leads-title{ font-size:14px; font-weight:700; color:#C9D6F0; }

  .today-banner{ background:#2A2414; border:1px solid #4A3F26; border-radius:10px; padding:12px 16px; margin-bottom:16px; }
  .today-banner.clear{ background:#122A20; border-color:#264A3A; }
  .today-header{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .today-bell{ font-size:15px; }
  .today-summary{ font-size:13px; font-weight:700; color:#E8C97E; flex:1; }
  .today-banner.clear .today-summary{ color:#3FC189; }
  .today-toggle{ font-size:11px; color:#8B7A4E; }
  .today-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .today-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#E8C97E; }

  .doc-list{ display:flex; flex-direction:column; gap:10px; }
  .doc-card{ background:#1A1F2B; border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .doc-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .doc-number{ font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.03em; }
  .doc-company{ font-size:14.5px; font-weight:700; }
  .doc-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .doc-total{ font-size:15px; font-weight:700; color:var(--accent); margin-top:8px; }
  .doc-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .doc-btn{ border:none; padding:7px 13px; border-radius:6px; font-size:12px; font-weight:600; }
  .doc-btn.primary{ background:var(--accent); color:#F5F8FF; }
  .doc-btn.ghost{ background:#232A3A; color:#C9D6F0; }
  .doc-btn.success{ background:var(--accepted); color:#F5F8FF; }
  .doc-btn.danger{ background:var(--declined); color:#F5F8FF; }
  .doc-link{ font-size:11.5px; color:var(--li); margin-top:6px; }

  .vision-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .vision-card{ background:#1A1F2B; border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; box-shadow:0 1px 2px rgba(15,31,61,.06); }
  .vision-img{ width:100%; height:150px; object-fit:cover; display:block; background:#181E2C; }
  .vision-img-empty{ display:flex; align-items:center; justify-content:center; }
  .vision-body{ padding:10px 12px; }
  .vision-title{ font-size:13px; font-weight:700; }
  .vision-notes{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .vision-del{ position:absolute; top:6px; right:6px; border:none; background:rgba(15,31,61,.55); color:#F5F8FF; width:22px; height:22px; border-radius:50%; font-size:14px; line-height:1; z-index:2; }

  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
  .folder-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; cursor:pointer; text-align:center; }
  .folder-card:hover{ border-color:var(--accent); }
  .folder-icon{ font-size:28px; margin-bottom:8px; }
  .folder-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folder-count{ font-size:11px; color:var(--muted); margin-top:3px; }
  .files-back{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; margin-bottom:14px; padding:0; }
  .file-row{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; }

  .week-range{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .week-progress-wrap{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .week-progress-bar{ background:#12151E; border-radius:20px; height:10px; overflow:hidden; margin-top:8px; }
  .week-progress-fill{ background:var(--accent); height:100%; border-radius:20px; transition:width .3s; }
  .weekly-item{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:8px; }
  .weekly-item input[type=checkbox]{ width:18px; height:18px; flex-shrink:0; }
  .weekly-item-label{ flex:1; font-size:13.5px; }
  .weekly-item.done .weekly-item-label{ text-decoration:line-through; color:var(--muted); }

  .creative-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .creative-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; }
  .creative-img{ width:100%; height:150px; object-fit:cover; display:block; background:#12151E; }
  .creative-img-empty{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; }
  .creative-body{ padding:10px 12px; }
  .creative-title{ font-size:13px; font-weight:700; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .creative-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .hashtag-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .hashtag-name{ font-size:13.5px; font-weight:700; margin-bottom:6px; }
  .hashtag-text{ font-size:12.5px; color:var(--muted); font-family:monospace; white-space:pre-wrap; word-break:break-word; background:#12151E; border-radius:7px; padding:8px 10px; margin-bottom:8px; }

  .lightbox-overlay{ position:fixed; inset:0; background:rgba(5,7,12,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; padding:30px; }
  .lightbox-img{ max-width:90vw; max-height:78vh; object-fit:contain; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.5); }
  .lightbox-caption{ color:#F5F8FF; font-size:13px; margin-top:14px; text-align:center; }
  .lightbox-close{ position:absolute; top:20px; right:24px; background:rgba(255,255,255,.12); border:none; color:#fff; width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; }

  .ledger-section{ background:#1A1F2B; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  .ledger-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .ledger-title{ font-size:13.5px; font-weight:700; color:#C9D6F0; }
  .ledger-add{ border:none; padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; color:#F5F8FF; }
  .ledger-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #181E2C; font-size:13px; }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-date{ color:var(--muted); font-size:11.5px; width:80px; flex-shrink:0; }
  .ledger-desc{ flex:1; }
  .ledger-amount{ font-weight:700; width:100px; text-align:right; }

  .cal-nav{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .cal-navbtn{ border:1px solid var(--line); background:#1A1F2B; padding:6px 12px; border-radius:7px; font-size:13px; font-weight:600; color:#C9D6F0; }
  .cal-month-label{ font-size:15px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow{ font-size:10.5px; font-weight:700; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase; }
  .cal-cell{ background:#1A1F2B; border:1px solid var(--line); border-radius:8px; min-height:72px; padding:6px; cursor:pointer; }
  .cal-cell.empty{ background:transparent; border:none; cursor:default; }
  .cal-cell.today{ border-color:var(--accent); border-width:2px; }
  .cal-cell.selected{ background:#132420; }
  .cal-daynum{ font-size:11.5px; font-weight:700; color:#C9D6F0; }
  .cal-dots{ display:flex; gap:3px; flex-wrap:wrap; margin-top:5px; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; }
  .cal-daypanel{ background:#1A1F2B; border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:16px; }
  .cal-event{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; border-bottom:1px solid #181E2C; }
  .cal-event:last-child{ border-bottom:none; }
  .cal-legend{ display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }

  .overlay{ position:fixed; inset:0; background:rgba(14,25,50,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#1A1F2B; border-radius:12px; width:560px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal.wide{ width:680px; }
  .modal.narrow{ width:400px; }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #2A3142; font-size:15px; font-weight:700; }
  .modal-header button{ border:none; background:transparent; color:var(--muted); }
  .modal-body{ padding:16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; gap:12px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; font-weight:600; color:#9AA5BC; }
  .field input, .field select, .field textarea{ border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:inherit; width:100%; background:#12151E; color:var(--ink); }
  .modal-footer{ display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid #2A3142; }
  .cancelbtn{ border:1px solid var(--line); background:#1A1F2B; color:#C7D0E0; padding:8px 16px; border-radius:7px; font-size:13px; font-weight:500; }
  .savebtn{ display:flex; align-items:center; gap:6px; border:none; background:var(--accent); color:#F5F8FF; padding:8px 16px; border-radius:7px; font-size:13px; font-weight:600; }
  .deletebtn{ border:none; background:#E0766B; color:#F5F8FF; padding:8px 16px; border-radius:7px; font-size:13px; font-weight:600; }
  .confirm-modal{ background:#1A1F2B; border-radius:12px; width:380px; max-width:100%; padding:20px; }

  .items-table{ width:100%; border-collapse:collapse; }
  .items-table th{ font-size:10.5px; padding:6px 6px; border-bottom:1px solid var(--line); }
  .items-table td{ padding:5px 6px; border-bottom:none; }
  .items-table input{ border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; width:100%; background:#12151E; color:var(--ink); }
  .items-table .qty-input, .items-table .price-input{ width:80px; }
  .items-table .line-total{ font-size:12.5px; font-weight:600; white-space:nowrap; width:80px; text-align:right; }
  .remove-item{ border:none; background:transparent; color:#E0766B; font-size:16px; padding:0 4px; }
  .add-item-btn{ background:#232A3A; border:none; color:#C9D6F0; font-size:12px; font-weight:600; padding:7px 12px; border-radius:6px; align-self:flex-start; }
  .doc-total-row{ display:flex; justify-content:flex-end; font-size:15px; font-weight:700; padding-top:6px; border-top:1px solid var(--line); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--sidebar); color:#F5F8FF; padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.25); opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main"><div class="app" id="app"></div></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
const DEALS_KEY = "nlws-crm-deals";
const QUOTES_KEY = "nlws-crm-quotes";
const INVOICES_KEY = "nlws-crm-invoices";
const COUNTERS_KEY = "nlws-crm-counters";
const LEDGER_KEY = "nlws-crm-ledger";
const EVENTS_KEY = "nlws-crm-events";
const CALLS_KEY = "nlws-crm-calls";
const WINS_KEY = "nlws-crm-wins";
const TIME_KEY = "nlws-crm-time";
const PIN_KEY = "nlws-crm-pin";
const WEEKLY_KEY = "nlws-crm-weekly";
const CREATIVES_KEY = "nlws-crm-creatives";
const CONTENT_CALENDAR_KEY = "nlws-crm-content-calendar";
const HASHTAGS_KEY = "nlws-crm-hashtags";
const BRAND_NOTES_KEY = "nlws-crm-brand-notes";
const OUTREACH_KEY = "nlws-crm-outreach";
const VISION_KEY = "nlws-crm-vision";

const STAGES = [
  { id:"warm", label:"Warm Leads", color:"var(--warm)" },
  { id:"followup", label:"Follow Up", color:"var(--followup)" },
  { id:"sentquote", label:"Sent Quotes", color:"var(--sentquote)" },
  { id:"paidquote", label:"Paid Quotes", color:"var(--paidquote)" },
  { id:"client", label:"Active Clients", color:"var(--client)" },
];
const stageColor = id => STAGES.find(s=>s.id===id)?.color || "var(--warm)";
const stageLabel = id => STAGES.find(s=>s.id===id)?.label || id;

const QUOTE_STATUS = { draft:{label:"Draft",color:"var(--draft)"}, sent:{label:"Sent",color:"var(--sent)"}, accepted:{label:"Accepted",color:"var(--accepted)"}, declined:{label:"Declined",color:"var(--declined)"} };
const INVOICE_STATUS = { draft:{label:"Draft",color:"var(--draft)"}, sent:{label:"Sent",color:"var(--sent)"}, partial:{label:"Partial",color:"var(--warm)"}, paid:{label:"Paid",color:"var(--paid)"} };
const EVENT_TYPE = { meeting:{label:"Meeting",color:"#9580E8"}, reminder:{label:"Reminder",color:"var(--warm)"}, other:{label:"Other",color:"var(--muted)"} };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => parseFloat(String(v).replace(/[^0-9.]/g,"")) || 0;
const fmt = n => "R" + n.toLocaleString("en-ZA",{maximumFractionDigits:0});
const escSafe = s => (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const today = () => new Date().toISOString().slice(0,10);

let deals = [];
let quotes = [];
let invoices = [];
let ledger = [];
let events = [];
let calls = [];
let wins = [];
let timeEntries = [];
let outreach = [];
let visionItems = [];
let weeklyChecklist = [];
let creatives = [];
let contentPosts = [];
let hashtagCollections = [];
let brandNotes = "";
let marketingTab = "library";
let contentCalYear = new Date().getFullYear();
let contentCalMonth = new Date().getMonth();
let contentCalSelectedDate = null;
let libraryFilterPlatform = "";
let libraryFilterStatus = "";
let counters = { quote:1, invoice:1 };

let currentView = "dashboard"; // dashboard | pipeline | list | documents | finances | calendar
let docTab = "quotes";
let outreachTab = "calls";
let query = "";
let editingDeal = null;
let confirmDeleteId = null;
let editingDoc = null;
let editingLedgerType = null;
let editingEvent = null;
let editingPaymentInvoiceId = null; // for editing an already-paid single payment
let payingInstallment = null; // { invoiceId, installmentId }
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSelectedDate = null;
let filesSelectedDealId = null;
let filesQuery = "";
let todayPanelOpen = true;
let isLocked = false;
let overduePanelOpen = true;
let selectedLeadIds = new Set();
let selectedCallIds = new Set();
let selectedOutreachIds = new Set();
let outreachQuery = "";
let pasteImportOpen = false;

function loadAll(){
  try { deals = JSON.parse(localStorage.getItem(DEALS_KEY) || "[]"); } catch(e){ deals = []; }
  try { quotes = JSON.parse(localStorage.getItem(QUOTES_KEY) || "[]"); } catch(e){ quotes = []; }
  try { invoices = JSON.parse(localStorage.getItem(INVOICES_KEY) || "[]"); } catch(e){ invoices = []; }
  try { ledger = JSON.parse(localStorage.getItem(LEDGER_KEY) || "[]"); } catch(e){ ledger = []; }
  try { events = JSON.parse(localStorage.getItem(EVENTS_KEY) || "[]"); } catch(e){ events = []; }
  try { calls = JSON.parse(localStorage.getItem(CALLS_KEY) || "[]"); } catch(e){ calls = []; }
  try { wins = JSON.parse(localStorage.getItem(WINS_KEY) || "[]"); } catch(e){ wins = []; }
  try { timeEntries = JSON.parse(localStorage.getItem(TIME_KEY) || "[]"); } catch(e){ timeEntries = []; }
  try { outreach = JSON.parse(localStorage.getItem(OUTREACH_KEY) || "[]"); } catch(e){ outreach = []; }
  try { visionItems = JSON.parse(localStorage.getItem(VISION_KEY) || "[]"); } catch(e){ visionItems = []; }
  try {
    const stored = localStorage.getItem(WEEKLY_KEY);
    weeklyChecklist = stored ? JSON.parse(stored) : DEFAULT_WEEKLY_ITEMS.map(label => ({ id: uid(), label, recurring: true, completedWeeks: [] }));
    weeklyChecklist = weeklyChecklist.map(item => item.recurring === undefined ? { ...item, recurring: true, completedWeeks: item.completedWeeks || [] } : item);
  } catch(e){ weeklyChecklist = []; }
  try { creatives = JSON.parse(localStorage.getItem(CREATIVES_KEY) || "[]"); } catch(e){ creatives = []; }
  try { contentPosts = JSON.parse(localStorage.getItem(CONTENT_CALENDAR_KEY) || "[]"); } catch(e){ contentPosts = []; }
  try { hashtagCollections = JSON.parse(localStorage.getItem(HASHTAGS_KEY) || "[]"); } catch(e){ hashtagCollections = []; }
  try { brandNotes = localStorage.getItem(BRAND_NOTES_KEY) || ""; } catch(e){ brandNotes = ""; }
  try { counters = JSON.parse(localStorage.getItem(COUNTERS_KEY) || '{"quote":1,"invoice":1}'); } catch(e){ counters = {quote:1,invoice:1}; }
}
function safeSetItem(key, value){
  try {
    localStorage.setItem(key, value);
    return true;
  } catch(e){
    toast("⚠️ Storage is full — this change wasn't saved. Try removing a large document or photo.");
    return false;
  }
}
function saveDeals(){ safeSetItem(DEALS_KEY, JSON.stringify(deals)); }
function saveQuotes(){ safeSetItem(QUOTES_KEY, JSON.stringify(quotes)); }
function saveInvoices(){ safeSetItem(INVOICES_KEY, JSON.stringify(invoices)); }
function saveLedger(){ safeSetItem(LEDGER_KEY, JSON.stringify(ledger)); }
function saveEvents(){ safeSetItem(EVENTS_KEY, JSON.stringify(events)); }
function saveCalls(){ safeSetItem(CALLS_KEY, JSON.stringify(calls)); }
function saveWins(){ safeSetItem(WINS_KEY, JSON.stringify(wins)); }
function saveTimeEntries(){ safeSetItem(TIME_KEY, JSON.stringify(timeEntries)); }
function saveOutreach(){ safeSetItem(OUTREACH_KEY, JSON.stringify(outreach)); }
function saveVision(){ safeSetItem(VISION_KEY, JSON.stringify(visionItems)); }
function saveWeeklyChecklist(){ safeSetItem(WEEKLY_KEY, JSON.stringify(weeklyChecklist)); }
function saveCreatives(){ safeSetItem(CREATIVES_KEY, JSON.stringify(creatives)); }
function saveContentPosts(){ safeSetItem(CONTENT_CALENDAR_KEY, JSON.stringify(contentPosts)); }
function saveHashtagCollections(){ safeSetItem(HASHTAGS_KEY, JSON.stringify(hashtagCollections)); }
function saveBrandNotes(){ safeSetItem(BRAND_NOTES_KEY, brandNotes); }

function getWeekStart(d = new Date()){
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1) - day; // days back to Monday
  date.setDate(date.getDate() + diff);
  return date.toISOString().slice(0,10);
}
function getWeekEnd(weekStartStr){
  const d = new Date(weekStartStr);
  d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0,10);
}
function saveCounters(){ safeSetItem(COUNTERS_KEY, JSON.stringify(counters)); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

const PROJECT_CHECKLIST_DEFAULT = ["Design Approved","Dev In Progress","Client Review","Live"];
const DEFAULT_WEEKLY_ITEMS = ["Follow up with warm leads","Review the pipeline","Send outstanding invoices","Outreach / prospecting","Check the calendar for the week ahead","Review this week's numbers"];

const MARKETING_PLATFORMS = ["Instagram","Facebook","TikTok","LinkedIn","Twitter / X","Email","Website / Blog","Other"];
const CREATIVE_STATUS = { "Idea":"#98A4BE", "Draft":"var(--warm)", "Ready":"var(--sent)", "Published":"var(--accepted)" };
const CONTENT_STATUS = { "Idea":"#98A4BE", "Drafting":"var(--warm)", "Scheduled":"var(--sent)", "Posted":"var(--accepted)" };

function blankCreative(){ return { id:uid(), title:"", image:"", platform:"Instagram", campaign:"", caption:"", status:"Idea", notes:"", createdDate: today() }; }
function blankContentPost(){ return { id:uid(), date: contentCalSelectedDate || today(), platform:"Instagram", caption:"", status:"Idea", creativeId:"", notes:"" }; }
function blankHashtagCollection(){ return { id:uid(), name:"", hashtags:"" }; }

function blankDeal(){
  return { id:uid(), company:"", contact:"", email:"", phone:"", stage:"warm", value:"", expenses:"", followUpDate:"", notes:"", created:today(), source:"",
    checklist: PROJECT_CHECKLIST_DEFAULT.map(label => ({ id:uid(), label, done:false })), documents: [] };
}
function blankItems(){ return [{ id:uid(), desc:"", qty:1, price:"" }]; }
function itemsTotal(items){ return (items||[]).reduce((s,it)=>s + (num(it.qty)*num(it.price)), 0); }
function blankQuote(){
  return { id:uid(), number:"Q-"+String(counters.quote).padStart(4,"0"), dealId:"", company:"", contact:"", email:"",
    items: blankItems(), notes:"", status:"draft", created: today(), sentDate:"", acceptedDate:"", declinedDate:"", invoiceId:"" };
}
function blankInvoice(){
  return { id:uid(), number:"INV-"+String(counters.invoice).padStart(4,"0"), quoteId:"", dealId:"", company:"", contact:"", email:"",
    items: blankItems(), notes:"", status:"draft", created: today(), sentDate:"", paidDate:"", amountPaid:"", dueDate:"",
    paymentPlan:false, installments:[], recurring:false };
}
function blankInstallment(dueDate, amount){ return { id:uid(), dueDate: dueDate||today(), amount: amount||"", paid:false, paidDate:"" }; }
function blankEvent(){ return { id:uid(), date: calSelectedDate || today(), time:"", title:"", type:"meeting", dealId:"", notes:"", done:false }; }
function blankLedgerEntry(type){ return { id:uid(), type, date:today(), description:"", amount:"" }; }

function filteredDeals(){
  const q = query.trim().toLowerCase();
  if(!q) return deals;
  return deals.filter(d => d.company.toLowerCase().includes(q) || d.contact.toLowerCase().includes(q) || (d.notes||"").toLowerCase().includes(q));
}

function invoicePaidAmount(inv){
  if(inv.paymentPlan) return (inv.installments||[]).filter(x=>x.paid).reduce((s,x)=>s+num(x.amount),0);
  return inv.status === "paid" ? num(inv.amountPaid) : 0;
}

function calcPipelineValue(){
  let total = 0;
  quotes.forEach(q => {
    if(q.invoiceId) return; // already turned into an invoice — the invoice covers this now
    if(q.status === "sent" || q.status === "accepted") total += itemsTotal(q.items);
  });
  invoices.forEach(inv => {
    if(inv.status === "paid") return; // already fully paid — that's revenue now, not pipeline
    const remaining = itemsTotal(inv.items) - invoicePaidAmount(inv);
    if(remaining > 0) total += remaining;
  });
  return total;
}

function totals(){
  const pipeline = calcPipelineValue();
  const thisMonth = monthlyIncome(1)[0];
  const paidIn = thisMonth.income;
  const moneyOut = thisMonth.expenses;
  return { pipeline, paidIn, moneyOut, net: paidIn - moneyOut };
}

function monthKey(dateStr){
  const d = dateStr ? new Date(dateStr) : null;
  if(!d || isNaN(d)) return null;
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function monthlyIncome(monthsBack){
  const now = new Date();
  const buckets = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label: MONTH_NAMES[d.getMonth()]+" '"+String(d.getFullYear()).slice(2), income:0, expenses:0 });
  }
  const byKey = Object.fromEntries(buckets.map(b=>[b.key,b]));
  invoices.forEach(inv=>{
    if(inv.paymentPlan){
      (inv.installments||[]).forEach(ins=>{
        if(ins.paid && num(ins.amount) > 0){
          const k = monthKey(ins.paidDate) || monthKey(inv.created);
          if(k && byKey[k]) byKey[k].income += num(ins.amount);
        }
      });
    } else if(inv.status==="paid" && num(inv.amountPaid) > 0){
      const k = monthKey(inv.paidDate) || monthKey(inv.created);
      if(k && byKey[k]) byKey[k].income += num(inv.amountPaid);
    }
  });
  ledger.forEach(l=>{
    const k = monthKey(l.date);
    if(!k || !byKey[k]) return;
    if(l.type==="income") byKey[k].income += num(l.amount);
    else byKey[k].expenses += num(l.amount);
  });
  deals.forEach(d=>{
    if(num(d.expenses) > 0){
      const k = monthKey(d.created);
      if(k && byKey[k]) byKey[k].expenses += num(d.expenses);
    }
  });
  return buckets;
}

function firstIncomeDate(){
  let earliest = null;
  const consider = (dateStr) => {
    if(!dateStr) return;
    const d = new Date(dateStr);
    if(isNaN(d)) return;
    if(!earliest || d < earliest) earliest = d;
  };
  invoices.forEach(inv=>{
    if(inv.paymentPlan){
      (inv.installments||[]).forEach(ins=>{ if(ins.paid && num(ins.amount)>0) consider(ins.paidDate); });
    } else if(inv.status==="paid" && num(inv.amountPaid)>0){
      consider(inv.paidDate);
    }
  });
  ledger.forEach(l=>{ if(l.type==="income" && num(l.amount)>0) consider(l.date); });
  return earliest;
}

function monthlyIncomeAllTime(){
  const start = firstIncomeDate();
  const now = new Date();
  if(!start){
    // no income recorded yet — just show the current month so the chart isn't empty
    return monthlyIncome(1);
  }
  const monthsSpan = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth()) + 1;
  return monthlyIncome(Math.max(1, monthsSpan));
}

function calcProjectedIncome(){
  const now = new Date();
  const dayOfMonth = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const buckets = monthlyIncomeAllTime();
  const thisMonthIncome = buckets.length ? buckets[buckets.length-1].income : 0;
  if(dayOfMonth <= 0) return thisMonthIncome;
  const dailyRate = thisMonthIncome / dayOfMonth;
  return dailyRate * daysInMonth;
}

function cleanupPastDoneEvents(){
  const t = today();
  const before = events.length;
  events = events.filter(e => !(e.done && e.date < t));
  if(events.length !== before) saveEvents();
}

function getOverdueItems(){
  const t = today();
  const items = [];
  invoices.forEach(inv => {
    if(inv.paymentPlan){
      (inv.installments||[]).forEach(ins => {
        if(!ins.paid && ins.dueDate && ins.dueDate < t) items.push({ label:`Overdue: ${inv.number} (${inv.company||""}) — ${fmt(num(ins.amount))} was due ${ins.dueDate}`, color:"var(--declined)" });
      });
    } else if(inv.status === "sent" && inv.dueDate && inv.dueDate < t){
      items.push({ label:`Overdue: ${inv.number} (${inv.company||""}) — ${fmt(itemsTotal(inv.items))} was due ${inv.dueDate}`, color:"var(--declined)" });
    }
  });
  return items;
}

function getTodayItems(){
  const t = today();
  const items = [];
  deals.forEach(d => { if(d.followUpDate === t) items.push({ kind:"followup", id:d.id, label:`Follow up with ${d.company||"Untitled"}`, color:"var(--warm)", done:false }); });
  events.forEach(e => {
    if(e.date === t){
      const info = EVENT_TYPE[e.type] || EVENT_TYPE.other;
      items.push({ kind:"event", id:e.id, label:`${info.label}: ${e.title}${e.time?` at ${e.time}`:""}`, color: info.color, done: !!e.done });
    }
  });
  invoices.forEach(inv => {
    if(inv.paymentPlan){
      (inv.installments||[]).forEach(ins => {
        if(!ins.paid && ins.dueDate === t) items.push({ kind:"installment", id:null, label:`Installment due today: ${inv.number} (${inv.company||""}) — ${fmt(num(ins.amount))}`, color:"var(--sentquote)", done:false });
      });
    }
  });
  return items;
}

function toggleTodayItem(kind, id){
  if(kind === "followup"){
    deals = deals.map(d => d.id===id ? { ...d, followUpDate:"" } : d);
    saveDeals();
  } else if(kind === "event"){
    events = events.map(e => e.id===id ? { ...e, done: !e.done } : e);
    saveEvents();
  }
  render();
}

function renderOverdueBanner(){
  const items = getOverdueItems();
  if(items.length === 0) return "";
  return `
    <div class="today-banner" style="background:#2A1616;border-color:#4A2A26;margin-bottom:10px">
      <div class="today-header" id="overdueHeaderToggle">
        <span class="today-bell">⚠️</span>
        <span class="today-summary" style="color:#E8A79E">${items.length} overdue invoice${items.length===1?"":"s"}</span>
        <span class="today-toggle" style="color:#C9A66E">${overduePanelOpen?"Hide ▲":"Show ▼"}</span>
      </div>
      ${overduePanelOpen ? `
        <div class="today-list">
          ${items.map(it => `<div class="today-item" style="color:#E8A79E"><span class="cal-dot" style="background:${it.color}"></span><span>${escSafe(it.label)}</span></div>`).join("")}
        </div>` : ""}
    </div>`;
}

function renderTodayBanner(){
  const items = getTodayItems();
  const isClear = items.length === 0;
  return `
    <div class="today-banner ${isClear?'clear':''}">
      <div class="today-header" id="todayHeaderToggle">
        <span class="today-bell">${isClear?"✅":"🔔"}</span>
        <span class="today-summary">${isClear ? "Nothing due today" : `${items.length} thing${items.length===1?"":"s"} due today`}</span>
        ${!isClear ? `<span class="today-toggle">${todayPanelOpen?"Hide ▲":"Show ▼"}</span>` : ""}
      </div>
      ${(!isClear && todayPanelOpen) ? `
        <div class="today-list">
          ${items.map((it,i) => `
            <div class="today-item" style="${it.done?'opacity:.55;text-decoration:line-through':''}">

function refreshListAndBulk(){
  const bulkBar = document.getElementById("bulkBar");

  if(selectedLeadIds.size > 0){

      e.stopPropagation();

    la.innerHTML = renderList(list);

    la.querySelectorAll(".del-row").forEach(b => b.onclick = () => { confirmDeleteId = b.dataset.id; renderConfirm(); });

      if(cb.checked) selectedLeadIds.add(cb.dataset.id); else selectedLeadIds.delete(cb.dataset.id);
      refreshListAndBulk();

    if(selectAll) selectAll.onchange = () => {
      if(selectAll.checked) list.forEach(d => selectedLeadIds.add(d.id));
      else list.forEach(d => selectedLeadIds.delete(d.id));
      refreshListAndBulk();
    };
  }
}

function parseFlexibleDate(str){
  if(!str) return null;
  const d = new Date(str);
  if(isNaN(d)) return null;
  return d.toISOString().slice(0,10);
}

function matchDealByName(name){
  if(!name) return null;
  const n = name.trim().toLowerCase();
  if(!n) return null;
  return deals.find(d => (d.company||"").trim().toLowerCase() === n) || null;
}

function looksLikeDateStr(s){
  if(!s) return false;
  const t = s.trim();
  return /^\d{1,4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,4}$/.test(t) || /^[A-Za-z]{3,9}\s+\d{1,2},?\s*\d{2,4}$/.test(t);
}

function splitPasteLine(line){
  return (line.includes("\t") ? line.split("\t") : line.split(",")).map(p=>p.trim());
}

// Tries to find a header row and map columns by name; returns null if no recognizable header found
function detectColumnMap(firstLineParts, keywordSets){
  const lower = firstLineParts.map(p=>p.toLowerCase());
  const map = lower.map(cell => {
    for(const [key, words] of Object.entries(keywordSets)){
      if(words.some(w => cell===w || cell.includes(w))) return key;
    }
    return null;
  });
  return map.some(k => k) ? map : null;
}

function parseCallPaste(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0) return [];

  const keywordSets = {
    date: ["date"],
    client: ["name","company","business","client","organization","organisation","org"],
    outcome: ["outcome","result"],
    notes: ["notes","note","comment","comments","details"],
    phone: ["phone","number","tel","cell","contact number"]
  };
  const firstParts = splitPasteLine(lines[0]);
  const colMap = detectColumnMap(firstParts, keywordSets);
  const dataLines = colMap ? lines.slice(1) : lines;

  return dataLines.map(line => {
    const parts = splitPasteLine(line);
    let dateRaw="", client="", notes="", phone="", outcomeRaw="";
    if(colMap){
      colMap.forEach((key, i) => {
        if(!key) return;
        const val = parts[i] || "";
        if(key==="date") dateRaw = val;
        else if(key==="client") client = val;
        else if(key==="phone") phone = val;
        else if(key==="outcome") outcomeRaw = val;
        else if(key==="notes") notes = notes ? `${notes}, ${val}` : val;
      });
    } else if(parts.length === 1){
      client = parts[0];
    } else {
      const dateIdx = parts.findIndex(looksLikeDateStr);
      if(dateIdx >= 0){
        dateRaw = parts[dateIdx];
        const rest = parts.filter((_,i)=>i!==dateIdx);
        client = rest[0] || "";
        notes = rest.slice(1).join(", ");
      } else {
        client = parts[0];
        notes = parts.slice(1).join(", ");
      }
    }
    if(phone) notes = notes ? `${notes} (Phone: ${phone})` : `Phone: ${phone}`;
    const outcomeKeys = Object.keys(CALL_OUTCOMES);
    const outcomeSynonyms = {
      "no answer": "Didn't Go Through", "didnt go through": "Didn't Go Through", "no response": "Didn't Go Through", "voicemail": "Didn't Go Through",
      "meeting": "Meeting Booked", "booked": "Meeting Booked",
      "interested": "Interested / Follow Up", "follow up": "Interested / Follow Up",
      "not interested": "Not Interested", "declined": "Not Interested",
      "done": "Completed", "spoke": "Completed", "called": "Completed"
    };
    const rawLower = outcomeRaw.toLowerCase().replace(/['’]/g,"");
    const matchedOutcome = outcomeRaw
      ? (outcomeKeys.find(k=>k.toLowerCase()===rawLower)
        || outcomeSynonyms[rawLower]
        || outcomeKeys.find(k=>k.toLowerCase().includes(rawLower) || rawLower.includes(k.toLowerCase().replace(/['’]/g,""))))
      : null;
    return { date: parseFlexibleDate(dateRaw) || today(), client, notes, outcome: matchedOutcome || "Not Called Yet" };
  }).filter(r => r.client || r.notes);
}

function parseOutreachPaste(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0) return [];

  const validChannels = ["Email","LinkedIn","Cold Call","Referral","Website","Other"];
  const validStatuses = Object.keys(OUTREACH_STATUS);
  const keywordSets = {
    date: ["date"],
    client: ["name","company","business","client","organization","organisation","org"],
    channel: ["channel","source","method"],
    status: ["status","stage","outcome"],
    notes: ["notes","note","comment","comments","details"]
  };
  const firstParts = splitPasteLine(lines[0]);
  const colMap = detectColumnMap(firstParts, keywordSets);
  const dataLines = colMap ? lines.slice(1) : lines;

  return dataLines.map(line => {
    const parts = splitPasteLine(line);
    let dateRaw="", client="", channelRaw="", statusRaw="", notes="";
    if(colMap){
      colMap.forEach((key, i) => {
        if(!key) return;
        const val = parts[i] || "";
        if(key==="date") dateRaw = val;
        else if(key==="client") client = val;
        else if(key==="channel") channelRaw = val;
        else if(key==="status") statusRaw = val;
        else if(key==="notes") notes = notes ? `${notes}, ${val}` : val;
      });
    } else {
      // no header: assume business name leads, then optional date/channel/status/notes in any trailing order
      client = parts[0] || "";
      const rest = parts.slice(1);
      const dateIdx = rest.findIndex(looksLikeDateStr);
      if(dateIdx >= 0) dateRaw = rest.splice(dateIdx,1)[0];
      const chanIdx = rest.findIndex(p => validChannels.some(c=>c.toLowerCase()===p.toLowerCase()));
      if(chanIdx >= 0) channelRaw = rest.splice(chanIdx,1)[0];
      const statIdx = rest.findIndex(p => validStatuses.some(s=>s.toLowerCase()===p.toLowerCase()));
      if(statIdx >= 0) statusRaw = rest.splice(statIdx,1)[0];
      notes = rest.join(", ");
    }
    const channel = validChannels.find(c=>c.toLowerCase()===channelRaw.toLowerCase()) || (channelRaw || "Other");
    const status = validStatuses.find(s=>s.toLowerCase()===statusRaw.toLowerCase()) || "Sent";
    return { date: parseFlexibleDate(dateRaw) || today(), client, channel, status, notes };
  }).filter(r => r.client || r.notes);
}

/* ---------- DASHBOARD VIEW ---------- */
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function computeDashboardStats(){
  const nowKey = monthKey(today());
  const weekAgo = daysAgo(6);
  const totalLeads = deals.length;
  const newLeadsThisWeek = deals.filter(d => d.created && d.created >= weekAgo).length;
  const callsToday = calls.filter(c => c.outcomeDate === today() && c.outcome && c.outcome !== "Not Called Yet").reduce((s,c)=>s+(num(c.count)||1),0);
  const followUpsToday = deals.filter(d => d.followUpDate === today()).length;
  const meetingsBooked = events.filter(e => e.type === "meeting" && e.date >= today()).length;
  const quotesSentCount = quotes.filter(q => q.sentDate).length;
  const dealsWonThisMonth = quotes.filter(q => q.acceptedDate && monthKey(q.acceptedDate) === nowKey).length
    + wins.filter(w => monthKey(w.date) === nowKey).length;
  const revenueThisMonth = monthlyIncome(1)[0].income;
  const acceptedCount = quotes.filter(q => q.status === "accepted" || q.invoiceId).length;
  const quoteConversionRate = quotesSentCount > 0 ? Math.round((acceptedCount / quotesSentCount) * 1000)/10 : 0;
  const convertedLeads = deals.filter(d => d.stage === "client").length;
  const conversionRate = totalLeads > 0 ? Math.round((convertedLeads / totalLeads) * 1000)/10 : 0;
  return { totalLeads, newLeadsThisWeek, callsToday, followUpsToday, meetingsBooked, quotesSentCount, dealsWonThisMonth, revenueThisMonth, conversionRate, quoteConversionRate };
}

  };
  document.getElementById("qa-minus-calls").onclick = () => {
    const n = Math.max(1, Math.round(num(document.getElementById("qa-calls").value)) || 1);
    // remove the most recently added quick-add call entries (dealId empty, outcomeDate today) first, newest first
    const candidates = calls.filter(c => !c.dealId && c.outcomeDate === today()).sort((a,b)=>b.id.localeCompare(a.id));
    let toRemove = n;
    const removeIds = new Set();
    for(const c of candidates){
      if(toRemove <= 0) break;
      const take = Math.min(toRemove, num(c.count) || 1);
      if(take >= (num(c.count) || 1)){
        removeIds.add(c.id);
        toRemove -= (num(c.count) || 1);
      } else {

  const area = document.getElementById("dashLeadsArea");
  if(sortedLeads.length === 0){

function drawBarChart(buckets){
  const canvas = document.getElementById("barChart");
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || canvas.parentElement.clientWidth - 40;
  const cssHeight = 230;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.width = cssWidth + "px"; canvas.style.height = cssHeight + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,cssWidth,cssHeight);
  const padding = { top: 16, right: 10, bottom: 30, left: 55 };
  const chartW = cssWidth - padding.left - padding.right;
  const chartH = cssHeight - padding.top - padding.bottom;
  const maxVal = Math.max(1, ...buckets.map(b=>Math.max(b.income,b.expenses))) * 1.15;
  const groupW = chartW / buckets.length;
  const barW = Math.min(26, groupW * 0.32);
  ctx.strokeStyle = "#2A3142"; ctx.fillStyle = "#93A2C2"; ctx.font = "10px -apple-system, sans-serif"; ctx.textAlign = "right";
  for(let i=0;i<=4;i++){
    const y = padding.top + chartH - (chartH * i/4);
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(padding.left + chartW, y); ctx.stroke();
    ctx.fillText("R" + Math.round(maxVal*i/4).toLocaleString("en-ZA"), padding.left - 8, y + 3);
  }
  buckets.forEach((b, i) => {
    const groupX = padding.left + i * groupW;
    const incomeH = (b.income / maxVal) * chartH;
    const expH = (b.expenses / maxVal) * chartH;
    const cx = groupX + groupW/2;
    ctx.fillStyle = "#3FC189"; ctx.fillRect(cx - barW - 3, padding.top + chartH - incomeH, barW, incomeH);
    ctx.fillStyle = "#E0766B"; ctx.fillRect(cx + 3, padding.top + chartH - expH, barW, expH);
    ctx.fillStyle = "#C9D6F0"; ctx.textAlign = "center"; ctx.font = "10.5px -apple-system, sans-serif";
    ctx.fillText(b.label, cx, padding.top + chartH + 18);
  });
  ctx.textAlign = "left";
  ctx.fillStyle = "#3FC189"; ctx.fillRect(padding.left, 0, 10, 10);
  ctx.fillStyle = "#C9D6F0"; ctx.fillText("Income", padding.left + 15, 9);
  ctx.fillStyle = "#E0766B"; ctx.fillRect(padding.left + 75, 0, 10, 10);
  ctx.fillStyle = "#C9D6F0"; ctx.fillText("Money out", padding.left + 90, 9);
}

function drawLineChart(buckets){
  const canvas = document.getElementById("lineChart");
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || canvas.parentElement.clientWidth - 40;
  const cssHeight = 230;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.width = cssWidth + "px"; canvas.style.height = cssHeight + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,cssWidth,cssHeight);
  const padding = { top: 16, right: 16, bottom: 30, left: 60 };
  const chartW = cssWidth - padding.left - padding.right;
  const chartH = cssHeight - padding.top - padding.bottom;

  let running = 0;
  const points = buckets.map(b => { running += (b.income - b.expenses); return running; });
  const minVal = Math.min(0, ...points);
  const maxVal = Math.max(1, ...points) * 1.15;
  const range = (maxVal - minVal) || 1;
  const stepX = chartW / (buckets.length - 1 || 1);
  const yFor = v => padding.top + chartH - ((v - minVal) / range) * chartH;

  ctx.strokeStyle = "#2A3142"; ctx.fillStyle = "#93A2C2"; ctx.font = "10px -apple-system, sans-serif"; ctx.textAlign = "right";
  for(let i=0;i<=4;i++){
    const val = minVal + (range * i/4);
    const y = yFor(val);
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(padding.left + chartW, y); ctx.stroke();
    ctx.fillText("R" + Math.round(val).toLocaleString("en-ZA"), padding.left - 8, y + 3);
  }

  // zero line
  if(minVal < 0){
    ctx.strokeStyle = "#454E63"; ctx.beginPath();
    ctx.moveTo(padding.left, yFor(0)); ctx.lineTo(padding.left+chartW, yFor(0)); ctx.stroke();
  }

  // line path
  ctx.strokeStyle = "#1BC2BC"; ctx.lineWidth = 2.5; ctx.beginPath();
  points.forEach((v,i) => {
    const x = padding.left + i*stepX;
    const y = yFor(v);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // points + labels
  points.forEach((v,i) => {
    const x = padding.left + i*stepX;
    const y = yFor(v);
    ctx.fillStyle = "#1BC2BC";
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#C9D6F0"; ctx.textAlign = "center"; ctx.font = "10.5px -apple-system, sans-serif";
    ctx.fillText(buckets[i].label, x, padding.top + chartH + 18);
  });
}

const STAGE_ORDER = { warm:0, followup:1, sentquote:2, paidquote:3, client:4 };
function advanceDealStage(dealId, targetStage){
  if(!dealId) return;
  const deal = deals.find(d=>d.id===dealId);
  if(!deal) return;
  if((STAGE_ORDER[targetStage]||0) > (STAGE_ORDER[deal.stage]||0)){
    deal.stage = targetStage;
    saveDeals();
  }
}

function setQuoteStatus(id, status, extra){
  quotes = quotes.map(q => q.id===id ? { ...q, status, ...extra } : q);
  const q = quotes.find(x=>x.id===id);
  if(status === 'sent' && q) advanceDealStage(q.dealId, 'sentquote');
  saveQuotes(); render();
  toast(status === 'sent' ? "Quote marked as sent" : status === 'accepted' ? "Quote accepted" : "Quote declined");
}
function setInvoiceStatus(id, status, extra){
  invoices = invoices.map(i => i.id===id ? { ...i, status, ...extra } : i);
  const inv = invoices.find(x=>x.id===id);
  if(status === 'sent' && inv) advanceDealStage(inv.dealId, 'sentquote');
  saveInvoices(); render();
  toast("Invoice marked as sent");
}
function renderDocDeleteConfirm(type, id){
  const isQuote = type === 'quote';
  const doc = isQuote ? quotes.find(q=>q.id===id) : invoices.find(i=>i.id===id);
  if(!doc) return;
  let warning = "";
  if(isQuote && doc.invoiceId){
    const linkedInv = invoices.find(i=>i.id===doc.invoiceId);
    warning = `This quote was converted to invoice ${escSafe(linkedInv?.number||"")}. Deleting the quote won't delete that invoice, but the link between them will be lost.`;
  } else if(!isQuote){
    const paidSoFar = invoicePaidAmount(doc);
    if(paidSoFar > 0) warning = `This invoice has ${fmt(paidSoFar)} recorded as paid. Deleting it will remove that amount from your revenue totals.`;
  }
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "docDelOverlay";
  overlay.innerHTML = `
    <div class="confirm-modal">
      <div style="font-size:14px;margin-bottom:8px">Delete <strong>${doc.number}</strong>${doc.company?` (${escSafe(doc.company)})`:""}? This can't be undone.</div>
      ${warning ? `<div style="font-size:12.5px;color:#E0766B;background:#2A1616;border:1px solid #4A2A26;border-radius:7px;padding:8px 10px;margin-bottom:4px">${warning}</div>` : ""}
      <div class="modal-footer" style="padding:14px 0 0">
        <button class="cancelbtn" id="cancelDocDel">Cancel</button>
        <button class="deletebtn" id="confirmDocDel">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.getElementById("cancelDocDel").onclick = () => overlay.remove();
  document.getElementById("confirmDocDel").onclick = () => {
    if(isQuote){
      quotes = quotes.filter(q=>q.id!==id);
      saveQuotes();
    } else {
      invoices = invoices.filter(i=>i.id!==id);
      saveInvoices();
    }
    overlay.remove();
    render();
    toast(`${isQuote?"Quote":"Invoice"} deleted`);
  };
}

function convertQuoteToInvoice(quoteId){
  const q = quotes.find(x=>x.id===quoteId);
  if(!q) return;
  const inv = {
    id: uid(), number: "INV-"+String(counters.invoice).padStart(4,"0"),
    quoteId: q.id, dealId: q.dealId, company: q.company, contact: q.contact, email: q.email,
    items: JSON.parse(JSON.stringify(q.items)), notes: q.notes, status: "draft",
    created: today(), sentDate: "", paidDate: "", amountPaid: "", paymentPlan:false, installments:[]
  };
  counters.invoice += 1; saveCounters();
  invoices = [...invoices, inv];
  saveInvoices();
  quotes = quotes.map(x => x.id===quoteId ? { ...x, invoiceId: inv.id } : x);
  saveQuotes();
  render();
  toast("Converted to " + inv.number);
}

function duplicateInvoice(invoiceId){
  const src = invoices.find(x=>x.id===invoiceId);
  if(!src) return;
  const dup = {
    ...JSON.parse(JSON.stringify(src)),
    id: uid(), number: "INV-"+String(counters.invoice).padStart(4,"0"),
    status: "draft", created: today(), sentDate: "", paidDate: "", amountPaid: "", dueDate: "",
    installments: (src.installments||[]).map(x => ({ ...x, id:uid(), paid:false, paidDate:"" }))
  };
  counters.invoice += 1; saveCounters();
  invoices = [...invoices, dup];
  saveInvoices();
  render();
  toast(`Duplicated as ${dup.number}`);
}

  overlay.className = "overlay"; overlay.id = "paidOverlay";
  overlay.innerHTML = `
    <div class="confirm-modal">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px">${inv.status==='paid' ? `Edit payment — ${inv.number}` : `Mark ${inv.number} as paid`}</div>
      <div class="row">
        <div class="field"><label>Amount received (R)</label><input id="p-amount" value="${escSafe(String(defaultAmount))}" /></div>
        <div class="field"><label>Date paid</label><input type="date" id="p-date" value="${defaultDate}" /></div>
      </div>
      <div class="modal-footer" style="padding:14px 0 0">
        <button class="cancelbtn" id="cancelPaid">Cancel</button>
        <button class="savebtn" id="confirmPaid">${inv.status==='paid' ? "Save" : "Confirm Paid"}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) closePaidModal(); };
  document.getElementById("cancelPaid").onclick = closePaidModal;
  document.getElementById("confirmPaid").onclick = () => {
    const amount = document.getElementById("p-amount").value;
    const date = document.getElementById("p-date").value || today();
    invoices = invoices.map(i => i.id===inv.id ? { ...i, status:"paid", amountPaid: amount, paidDate: date } : i);
    advanceDealStage(inv.dealId, 'paidquote');
    saveInvoices();
    closePaidModal();
    render();
    toast(inv.status==='paid' ? "Payment updated" : "Marked paid — added to revenue");
  };
}
function closePaidModal(){
  editingPaymentInvoiceId = null;
  const o = document.getElementById("paidOverlay");
  if(o) o.remove();
}

function renderInstallmentModal(){
  const { invoiceId, installmentId } = payingInstallment || {};
  const inv = invoices.find(i=>i.id===invoiceId);
  if(!inv) return;
  const ins = (inv.installments||[]).find(x=>x.id===installmentId);
  if(!ins) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "instOverlay";
  overlay.innerHTML = `
    <div class="confirm-modal">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px">${ins.paid ? "Edit" : "Mark"} installment paid — ${inv.number}</div>
      <div class="row">
        <div class="field"><label>Amount received (R)</label><input id="i-amount" value="${escSafe(String(ins.amount))}" /></div>
        <div class="field"><label>Date paid</label><input type="date" id="i-date" value="${ins.paidDate || today()}" /></div>
      </div>
      <div class="modal-footer" style="padding:14px 0 0">
        <button class="cancelbtn" id="cancelInst">Cancel</button>
        <button class="savebtn" id="confirmInst">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if(e.target===overlay) closeInstallmentModal(); };
  document.getElementById("cancelInst").onclick = closeInstallmentModal;
  document.getElementById("confirmInst").onclick = () => {
    const amount = document.getElementById("i-amount").value;
    const date = document.getElementById("i-date").value || today();
    invoices = invoices.map(i => {
      if(i.id !== invoiceId) return i;
      const updatedInstallments = i.installments.map(x => x.id===installmentId ? { ...x, amount, paid:true, paidDate:date } : x);
      const allPaid = updatedInstallments.every(x=>x.paid);
      const anyPaid = updatedInstallments.some(x=>x.paid);
      if(allPaid) advanceDealStage(i.dealId, 'paidquote');
      return { ...i, installments: updatedInstallments, status: allPaid ? "paid" : (anyPaid ? "partial" : i.status) };
    });
    saveInvoices();
    closeInstallmentModal();
    render();
    toast("Installment updated — added to revenue");
  };
}
function closeInstallmentModal(){
  payingInstallment = null;
  const o = document.getElementById("instOverlay");
  if(o) o.remove();
}

/* ---------- QUOTE / INVOICE BUILDER MODAL ---------- */
function openDocBuilder(type, data){
  editingDoc = { type, data: JSON.parse(JSON.stringify(data)) };
  renderDocBuilder();
}
function closeDocBuilder(){
  editingDoc = null;
  const o = document.getElementById("docOverlay");
  if(o) o.remove();
}
function renderDocBuilder(){
  if(!editingDoc) return;
  const { type, data } = editingDoc;
  const isQuote = type === 'quote';
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "docOverlay";
  overlay.innerHTML = `
    <div class="modal wide">
      <div class="modal-header"><span>${data.number} — ${isQuote ? "Quote" : "Invoice"}</span><button id="closeDocModal">✕</button></div>
      <div class="modal-body">
        <div class="row">
          <div class="field"><label>Link to existing client (optional)</label>
            <select id="d-deal">
              <option value="">— none —</option>
              ${deals.map(d=>`<option value="${d.id}" ${data.dealId===d.id?"selected":""}>${escSafe(d.company)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Company</label><input id="d-company" value="${escSafe(data.company)}" placeholder="Simonsberg Metalworks" /></div>
          <div class="field"><label>Contact name</label><input id="d-contact" value="${escSafe(data.contact)}" placeholder="Jane Smith" /></div>
        </div>
        <div class="row">
          <div class="field"><label>Email</label><input id="d-email" value="${escSafe(data.email)}" placeholder="jane@company.com" /></div>
          ${!isQuote ? `<div class="field"><label>Due date (optional)</label><input type="date" id="d-duedate" value="${escSafe(data.dueDate||"")}" /></div>` : ""}
        </div>
        <table class="items-table">
          <thead><tr><th style="text-align:left">Description</th><th>Qty</th><th>Unit Price (R)</th><th></th><th></th></tr></thead>
          <tbody id="itemsBody"></tbody>
        </table>
        <button class="add-item-btn" id="addItemBtn">+ Add item</button>
        <div class="doc-total-row" id="totalRow"></div>
        ${!isQuote ? `
        <div class="li-section" style="background:#181E2C;border:1px solid #2A3142;border-radius:9px;padding:12px">
          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#C9D6F0">
            <input type="checkbox" id="d-planToggle" ${data.paymentPlan?"checked":""}/> Use a payment plan (installments)
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#C9D6F0;margin-top:8px">
            <input type="checkbox" id="d-recurring" ${data.recurring?"checked":""}/> Retainer — I'll duplicate this monthly
          </label>
          <div id="planBody" style="${data.paymentPlan?"":"display:none"}; margin-top:10px"></div>
        </div>` : ""}
        <div class="field"><label>Notes</label><textarea id="d-notes" style="min-height:60px">${escSafe(data.notes)}</textarea></div>
      </div>
      <div class="modal-footer">
        <button class="cancelbtn" id="cancelDoc">Cancel</button>
        <button class="savebtn" id="saveDoc">Save ${isQuote?"Quote":"Invoice"}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  function renderItemsBody(){
    const body = document.getElementById("itemsBody");
    body.innerHTML = data.items.map(it => `
      <tr data-item="${it.id}">
        <td><input class="desc-input" value="${escSafe(it.desc)}" placeholder="Website build — homepage & 4 pages" /></td>
        <td><input class="qty-input" value="${escSafe(String(it.qty))}" /></td>
        <td><input class="price-input" value="${escSafe(String(it.price))}" placeholder="0" /></td>
        <td class="line-total">${fmt(num(it.qty)*num(it.price))}</td>
        <td><button class="remove-item" data-remove="${it.id}">×</button></td>
      </tr>`).join("");
    body.querySelectorAll("tr").forEach(row => {
      const id = row.dataset.item;
      row.querySelector(".desc-input").oninput = e => { data.items.find(x=>x.id===id).desc = e.target.value; };
      row.querySelector(".qty-input").oninput = e => { data.items.find(x=>x.id===id).qty = e.target.value; updateTotal(); row.querySelector(".line-total").textContent = fmt(num(data.items.find(x=>x.id===id).qty)*num(data.items.find(x=>x.id===id).price)); };
      row.querySelector(".price-input").oninput = e => { data.items.find(x=>x.id===id).price = e.target.value; updateTotal(); row.querySelector(".line-total").textContent = fmt(num(data.items.find(x=>x.id===id).qty)*num(data.items.find(x=>x.id===id).price)); };
    });
    body.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => {
      if(data.items.length <= 1) return;
      data.items = data.items.filter(x=>x.id!==b.dataset.remove);
      renderItemsBody(); updateTotal();
    });
  }
  function updateTotal(){ document.getElementById("totalRow").textContent = "Total: " + fmt(itemsTotal(data.items)); }
  renderItemsBody(); updateTotal();

  if(!isQuote){
    if(!data.installments) data.installments = [];
    function renderPlanBody(){
      const body = document.getElementById("planBody");
      if(!body) return;
      body.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px">
          ${data.installments.map(ins => `
            <div class="row" data-inst="${ins.id}" style="align-items:flex-end">
              <div class="field"><label>Due date</label><input type="date" class="inst-date" value="${ins.dueDate}" /></div>
              <div class="field"><label>Amount (R)</label><input class="inst-amount" value="${escSafe(String(ins.amount))}" placeholder="0" /></div>
              <button class="remove-item" data-removeinst="${ins.id}" style="margin-bottom:9px">×</button>
            </div>`).join("")}
        </div>
        <button class="add-item-btn" id="addInstBtn" style="margin-top:8px">+ Add installment</button>
        <div id="instTotalLine" style="font-size:11.5px;margin-top:6px"></div>
      `;
      updateInstTotal();
      body.querySelectorAll("[data-inst]").forEach(row => {
        const id = row.dataset.inst;
        row.querySelector(".inst-date").oninput = e => { data.installments.find(x=>x.id===id).dueDate = e.target.value; };
        row.querySelector(".inst-amount").oninput = e => { data.installments.find(x=>x.id===id).amount = e.target.value; updateInstTotal(); };
      });
      body.querySelectorAll("[data-removeinst]").forEach(b => b.onclick = () => { data.installments = data.installments.filter(x=>x.id!==b.dataset.removeinst); renderPlanBody(); });
      const addBtn = document.getElementById("addInstBtn");
      if(addBtn) addBtn.onclick = () => { data.installments.push({ id:uid(), dueDate:today(), amount:"", paid:false, paidDate:"" }); renderPlanBody(); };
    }
    function updateInstTotal(){
      const line = document.getElementById("instTotalLine");
      if(!line) return;
      const planTotal = data.installments.reduce((s,x)=>s+num(x.amount),0);
      const invTotal = itemsTotal(data.items);
      line.style.color = planTotal===invTotal ? '#93A2C2' : '#E0766B';
      line.textContent = `Installments total: ${fmt(planTotal)}` + (planTotal!==invTotal ? ` (invoice total is ${fmt(invTotal)})` : "");
    }
    if(data.paymentPlan){
      if(data.installments.length === 0) data.installments.push({ id:uid(), dueDate:today(), amount: itemsTotal(data.items) || "", paid:false, paidDate:"" });
      renderPlanBody();
    }
    document.getElementById("d-planToggle").onchange = e => {
      data.paymentPlan = e.target.checked;
      document.getElementById("planBody").style.display = e.target.checked ? "" : "none";
      if(e.target.checked && data.installments.length === 0){
        data.installments.push({ id:uid(), dueDate:today(), amount: itemsTotal(data.items) || "", paid:false, paidDate:"" });
        renderPlanBody();
      }
    };
  }

  document.getElementById("addItemBtn").onclick = () => { data.items.push({ id: uid(), desc:"", qty:1, price:"" }); renderItemsBody(); updateTotal(); };
  document.getElementById("d-deal").onchange = e => {
    const deal = deals.find(x=>x.id===e.target.value);
    if(deal){
      if(!document.getElementById("d-company").value) document.getElementById("d-company").value = deal.company;
      if(!document.getElementById("d-contact").value) document.getElementById("d-contact").value = deal.contact;
      if(!document.getElementById("d-email").value) document.getElementById("d-email").value = deal.email;
    }
  };
  overlay.onclick = e => { if(e.target===overlay) closeDocBuilder(); };
  document.getElementById("closeDocModal").onclick = closeDocBuilder;
  document.getElementById("cancelDoc").onclick = closeDocBuilder;
  document.getElementById("saveDoc").onclick = () => {
    const company = document.getElementById("d-company").value.trim();
    if(!company) return;
    const updated = {
      ...data,
      dealId: document.getElementById("d-deal").value,
      company,
      contact: document.getElementById("d-contact").value,
      email: document.getElementById("d-email").value,
      notes: document.getElementById("d-notes").value,
      items: data.items.filter(it => it.desc.trim() || num(it.price) > 0),
    };
    if(updated.items.length === 0) updated.items = blankItems();
    if(!isQuote){
      updated.paymentPlan = !!data.paymentPlan;
      updated.installments = data.installments || [];
      updated.dueDate = document.getElementById("d-duedate") ? document.getElementById("d-duedate").value : "";
      updated.recurring = document.getElementById("d-recurring") ? document.getElementById("d-recurring").checked : false;
    }
    if(isQuote){
      const exists = quotes.some(q=>q.id===updated.id);
      if(!exists) { counters.quote += 1; saveCounters(); }
      quotes = exists ? quotes.map(q=>q.id===updated.id?updated:q) : [...quotes, updated];
      saveQuotes();
    } else {
      const exists = invoices.some(i=>i.id===updated.id);
      if(!exists) { counters.invoice += 1; saveCounters(); }
      invoices = exists ? invoices.map(i=>i.id===updated.id?updated:i) : [...invoices, updated];
      saveInvoices();
    }
    closeDocBuilder();
    render();
    toast("Saved");
  };
}

/* ---------- CALENDAR VIEW ---------- */
function getCalendarEvents(){
  const evts = [];
  deals.forEach(d => { if(d.followUpDate) evts.push({ date:d.followUpDate, label:`Follow up: ${d.company||"Untitled"}`, color:"var(--warm)", source:"deal" }); });
  quotes.forEach(q => {
    if(q.sentDate) evts.push({ date:q.sentDate, label:`Quote sent: ${q.number} (${q.company||""})`, color:"var(--sent)", source:"quote" });
    if(q.acceptedDate) evts.push({ date:q.acceptedDate, label:`Quote accepted: ${q.number}`, color:"var(--accepted)", source:"quote" });
    if(q.declinedDate) evts.push({ date:q.declinedDate, label:`Quote declined: ${q.number}`, color:"var(--declined)", source:"quote" });
  });
  invoices.forEach(inv => {
    if(inv.sentDate) evts.push({ date:inv.sentDate, label:`Invoice sent: ${inv.number} (${inv.company||""})`, color:"var(--sentquote)", source:"invoice" });
    if(inv.paymentPlan){
      (inv.installments||[]).forEach(ins => {
        if(ins.paid && ins.paidDate) evts.push({ date:ins.paidDate, label:`Installment paid: ${inv.number} — ${fmt(num(ins.amount))}`, color:"var(--paid)", source:"invoice" });
      });
    } else if(inv.paidDate){
      evts.push({ date:inv.paidDate, label:`Invoice paid: ${inv.number} — ${fmt(num(inv.amountPaid))}`, color:"var(--paid)", source:"invoice" });
    }
  });
  ledger.forEach(l => {
    evts.push({ date:l.date, label:`${l.type==='income'?'Income':'Expense'}: ${l.description||"—"} (${fmt(num(l.amount))})`, color: l.type==='income' ? "var(--income)" : "var(--expense)", source:"ledger" });
  });
  events.forEach(ev => {
    const typeInfo = EVENT_TYPE[ev.type] || EVENT_TYPE.other;
    const withClient = ev.dealId ? deals.find(x=>x.id===ev.dealId) : null;
    evts.push({ date:ev.date, label: `${typeInfo.label}: ${ev.title}${withClient ? ` with ${withClient.company}` : ""}${ev.time?` at ${ev.time}`:""}`, color: typeInfo.color, source:"custom", id: ev.id, notes: ev.notes, doneFlag: !!ev.done });
  });
  return evts;
}

function renderCalendarView(container){
  const calEvents = getCalendarEvents();
  const firstOfMonth = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const startWeekday = firstOfMonth.getDay();
  const todayStr = today();

  const eventsByDate = {};
  calEvents.forEach(e => { if(!e.date) return; (eventsByDate[e.date] = eventsByDate[e.date] || []).push(e); });

  let cells = "";
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = calYear+"-"+String(calMonth+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const dayEvents = eventsByDate[dateStr] || [];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === calSelectedDate;
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${dateStr}">
        <div class="cal-daynum">${day}</div>
        <div class="cal-dots">${dayEvents.slice(0,4).map(e=>`<span class="cal-dot" style="background:${e.color}"></span>`).join("")}</div>
      </div>`;
  }

  container.innerHTML = `
    <div class="cal-nav">
      <button class="cal-navbtn" id="prevMonth">←</button>
      <div class="cal-month-label">${MONTH_NAMES[calMonth]} ${calYear}</div>
      <button class="cal-navbtn" id="nextMonth">→</button>
      <button class="cal-navbtn" id="todayMonth">Today</button>
      <div style="flex:1"></div>
      <button class="addbtn" id="addEventBtn">+ Add Event</button>
    </div>
    <div class="cal-grid">
      ${DOW_NAMES.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="cal-dot" style="background:#9580E8"></span>Meeting</span>
      <span><span class="cal-dot" style="background:var(--warm)"></span>Follow-up / Reminder</span>
      <span><span class="cal-dot" style="background:var(--sent)"></span>Quote sent</span>
      <span><span class="cal-dot" style="background:var(--accepted)"></span>Quote accepted</span>
      <span><span class="cal-dot" style="background:var(--declined)"></span>Quote declined</span>
      <span><span class="cal-dot" style="background:var(--sentquote)"></span>Invoice sent</span>
      <span><span class="cal-dot" style="background:var(--paid)"></span>Invoice/installment paid</span>
      <span><span class="cal-dot" style="background:var(--income)"></span>Income</span>
      <span><span class="cal-dot" style="background:var(--expense)"></span>Expense</span>
      <span><span class="cal-dot" style="background:var(--muted)"></span>Other</span>
    </div>
    <div id="dayPanel"></div>
  `;
  document.getElementById("addEventBtn").onclick = () => openEventModal(blankEvent());
  document.getElementById("prevMonth").onclick = () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); };
  document.getElementById("nextMonth").onclick = () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); };
  document.getElementById("todayMonth").onclick = () => { const n=new Date(); calMonth=n.getMonth(); calYear=n.getFullYear(); calSelectedDate=todayStr; render(); };
  container.querySelectorAll("[data-date]").forEach(c => c.onclick = () => { calSelectedDate = c.dataset.date; render(); });

  if(calSelectedDate){
    const dayEvents = eventsByDate[calSelectedDate] || [];
    const panel = document.getElementById("dayPanel");
    panel.innerHTML = `
      <div class="cal-daypanel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:700;font-size:13.5px">${calSelectedDate}</div>
          <button class="doc-btn primary" id="addEventForDay">+ Add event</button>
        </div>
        ${dayEvents.length===0 ? `<div class="empty" style="padding:6px 0">Nothing on this day.</div>` :
          dayEvents.map(e=>`
            <div class="cal-event">
              <span class="cal-dot" style="background:${e.color}"></span>
              ${e.source==='custom' ? `<input type="checkbox" class="cal-done-check" data-eid="${e.id}" ${e.doneFlag?"checked":""} />` : ""}
              <span style="flex:1;${e.source==='custom'&&e.doneFlag?'opacity:.55;text-decoration:line-through':''}">${escSafe(e.label)}</span>
              ${e.source==='custom' ? `<button class="iconbtn" data-editevt="${e.id}">Edit</button><button class="iconbtn" data-delevt="${e.id}">Delete</button>` : ""}
            </div>`).join("")}
      </div>`;
    document.getElementById("addEventForDay").onclick = () => openEventModal(blankEvent());
    panel.querySelectorAll(".cal-done-check").forEach(cb => cb.onchange = () => {
      events = events.map(x => x.id===cb.dataset.eid ? { ...x, done: cb.checked } : x);
      saveEvents(); render();
    });
    panel.querySelectorAll("[data-editevt]").forEach(b => b.onclick = () => openEventModal(events.find(e=>e.id===b.dataset.editevt)));
    panel.querySelectorAll("[data-delevt]").forEach(b => b.onclick = () => {
      events = events.filter(e=>e.id!==b.dataset.delevt);
      saveEvents(); render(); toast("Event deleted");
    });
  }
}

function openEventModal(ev){
  editingEvent = JSON.parse(JSON.stringify(ev));
  const overlay = document.createElement("div");
  overlay.className = "overlay"; overlay.id = "eventOverlay";
  const e = editingEvent;
  overlay.innerHTML = `
    <div class="modal narrow">
      <div class="modal-header"><span>${e.title ? "Edit Event" : "New Event"}</span><button id="closeEventModal">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Title</label><input id="e-title" value="${escSafe(e.title)}" placeholder="Call with client, site visit…" /></div>
        <div class="row">
          <div class="field"><label>Type</label>
            <select id="e-type">
              ${Object.entries(EVENT_TYPE).map(([k,v])=>`<option value="${k}" ${e.type===k?"selected":""}>${v.label}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>With (optional)</label>
            <select id="e-deal">
              <option value="">— none —</option>
              ${deals.map(d=>`<option value="${d.id}" ${e.dealId===d.id?"selected":""}>${escSafe(d.company)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Date</label><input type="date" id="e-date" value="${e.date||today()}" /></div>
          <div class="field"><label>Time (optional)</label><input type="time" id="e-time" value="${escSafe(e.time)}" /></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="e-notes" style="min-height:60px">${escSafe(e.notes)}</textarea></div>
      </div>
      <div class="modal-footer">
        ${e.title ? `<button class="deletebtn" id="deleteEvent" style="margin-right:auto">Delete</button>` : ""}
        <button class="cancelbtn" id="cancelEvent">Cancel</button>
        <button class="savebtn" id="saveEvent">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = ev2 => { if(ev2.target===overlay) closeEventModal(); };
  document.getElementById("closeEventModal").onclick = closeEventModal;
  document.getElementById("cancelEvent").onclick = closeEventModal;
  const delBtn = document.getElementById("deleteEvent");
  if(delBtn) delBtn.onclick = () => { events = events.filter(x=>x.id!==e.id); saveEvents(); closeEventModal(); render(); toast("Event deleted"); };
  document.getElementById("saveEvent").onclick = () => {
    const title = document.getElementById("e-title").value.trim();
    if(!title) return;
    const updated = { ...e, title, type: document.getElementById("e-type").value, dealId: document.getElementById("e-deal").value, date: document.getElementById("e-date").value || today(), time: document.getElementById("e-time").value, notes: document.getElementById("e-notes").value };
    const exists = events.some(x=>x.id===updated.id);
    events = exists ? events.map(x=>x.id===updated.id?updated:x) : [...events, updated];
    saveEvents();
    closeEventModal();
    calSelectedDate = updated.date;
    render();
    toast("Saved");
  };
}
function closeEventModal(){
  editingEvent = null;
  const o = document.getElementById("eventOverlay");
  if(o) o.remove();
}

function dealCallSummary(dealId){
  const dealCalls = calls.filter(c=>c.dealId===dealId).sort((a,b)=>b.date.localeCompare(a.date));
  if(dealCalls.length===0) return "No calls logged yet";
  return `${dealCalls.length} call${dealCalls.length===1?"":"s"} logged · last on ${dealCalls[0].date}`;
}
function dealTimeSummary(dealId){
  const entries = timeEntries.filter(t=>t.dealId===dealId);
  if(entries.length===0) return "No time logged yet";
  const total = entries.reduce((s,t)=>s+num(t.hours),0);
  return `${total}h logged across ${entries.length} entr${entries.length===1?"y":"ies"}`;
}

/* ---------- OUTREACH & CALLS VIEW ---------- */
const OUTREACH_STATUS = {

function renderOutreachView(container){
